# jobs.byldr.co → deisy-jobs on 127.0.0.1:3010
# Place under /etc/nginx/sites-available/jobs.byldr.co and symlink into sites-enabled.

upstream deisy_jobs {
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name jobs.byldr.co;

    # Prefer terminating TLS at this vhost (certbot) or an outer LB.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jobs.byldr.co;

    # ssl_certificate     /etc/letsencrypt/live/jobs.byldr.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jobs.byldr.co/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 2m;

    location / {
        proxy_pass http://deisy_jobs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
